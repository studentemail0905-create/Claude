services:
  medium-mcp-server:
    build: .
    image: medium-mcp-server:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: "0.0.0.0"
      MEDIUM_INTEGRATION_TOKEN: ${MEDIUM_INTEGRATION_TOKEN:?set MEDIUM_INTEGRATION_TOKEN in your shell or a .env file}
      MCP_SERVER_AUTH_TOKEN: ${MCP_SERVER_AUTH_TOKEN:?set MCP_SERVER_AUTH_TOKEN in your shell or a .env file}
      MEDIUM_ENABLE_READ_TOOLS: "true"
      MEDIUM_ENABLE_WRITE_TOOLS: "true"
      MEDIUM_ENABLE_PUBLISH_TOOL: "true"
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
